name: Create wp-parsely release PR
run-name: Prepare wp-parsely ${{ inputs.release_type }} release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: prepare-wp-parsely-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Use npm 11.21.3
        run: npm install -g --ignore-scripts npm@11.21.3

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Prepare version and changelog
        id: release
        run: |
          CURRENT_VERSION=$(node --input-type=module -e \
            "import { pluginVersion } from './bin/release-version.mjs'; console.log(pluginVersion());")
          NEW_VERSION=$(node bin/release-version.mjs next "$RELEASE_TYPE")
          gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=open" \
            --jq '.[].title' > "$RUNNER_TEMP/milestones.txt"
          if ! grep -Fxq "$NEW_VERSION" "$RUNNER_TEMP/milestones.txt"; then
            echo "No open milestone is named $NEW_VERSION. Check the release type and the milestone's title." >&2
            exit 1
          fi
          # Notes are read from the committed changelog, not exported as env.
          printf 'n\n' | env -u GITHUB_ENV php bin/release.php "$CURRENT_VERSION" "$NEW_VERSION"
          node bin/release-version.mjs metadata "$CURRENT_VERSION" > "$RUNNER_TEMP/release.json"
          test "$(git branch --show-current)" = "update/wp-parsely-version-to-$NEW_VERSION"
          test "$(node -p "require(process.env.RUNNER_TEMP + '/release.json').version")" = "$NEW_VERSION"
          test "$(node -p "require(process.env.RUNNER_TEMP + '/release.json').release")" = true
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=update/wp-parsely-version-to-$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Push release branch and open PR
        env:
          NEW_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          git push --set-upstream origin "$RELEASE_BRANCH"
          node --input-type=module <<'JS' > "$RUNNER_TEMP/release-pr.md"
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release.json`));
          console.log(
            `Prepares wp-parsely ${release.version}.\n\n${release.notes}\n\n` +
            'Merging the version change into trunk automatically tests, builds, ' +
            'and publishes to GitHub and WordPress.org.'
          );
          JS
          gh pr create --base "$BASE_BRANCH" --head "$RELEASE_BRANCH" \
            --title "Update version number and changelog for $NEW_VERSION release" \
            --body-file "$RUNNER_TEMP/release-pr.md" \
            --assignee "$GITHUB_ACTOR" --milestone "$NEW_VERSION"
