name: Create wp-parsely release PR
run-name: Prepare wp-parsely ${{ inputs.release_type }} release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-wp-parsely-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Prepare version and changelog
        id: release
        run: |
          CURRENT_VERSION=$(node --input-type=module -e \
            "import { pluginVersion } from './bin/release-version.mjs'; console.log(pluginVersion());")
          NEW_VERSION=$(node bin/release-version.mjs next "$RELEASE_TYPE")
          # Keep the existing milestone/label-based changelog generator.
          printf 'n\n' | php bin/release.php "$CURRENT_VERSION" "$NEW_VERSION"
          node bin/release-version.mjs metadata "$CURRENT_VERSION" > "$RUNNER_TEMP/release.json"
          test "$(git branch --show-current)" = "update/wp-parsely-version-to-$NEW_VERSION"
          test "$(node -p "require(process.env.RUNNER_TEMP + '/release.json').version")" = "$NEW_VERSION"
          test "$(node -p "require(process.env.RUNNER_TEMP + '/release.json').release")" = true
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=update/wp-parsely-version-to-$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Push release branch and open PR
        env:
          NEW_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          git push --set-upstream origin "$RELEASE_BRANCH"
          node --input-type=module <<'JS' > "$RUNNER_TEMP/release-pr.md"
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release.json`));
          console.log(`Prepares wp-parsely ${release.version}.\n\n${release.notes}\n\nMerging the version change into trunk automatically tests, builds, and publishes to GitHub and WordPress.org.`);
          JS
          gh pr create --base "$BASE_BRANCH" --head "$RELEASE_BRANCH" \
            --title "Release wp-parsely $NEW_VERSION" \
            --body-file "$RUNNER_TEMP/release-pr.md" \
            --assignee "$GITHUB_ACTOR" --milestone "$NEW_VERSION"

      # PRs created with GITHUB_TOKEN do not trigger pull_request workflows.
      # Explicit workflow_dispatch events do, and retain the existing check names.
      - name: Run checks on the generated PR
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          for workflow in cs-lint.yml unit-tests.yml node.js.yml integration-tests.yml e2e-tests.yml; do
            gh workflow run "$workflow" --ref "$RELEASE_BRANCH"
          done
