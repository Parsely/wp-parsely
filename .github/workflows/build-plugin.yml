name: Build wp-parsely
on:
  push:
    branches:
      - trunk
      - develop
  workflow_dispatch:
env:
  SOURCE_REF: ${{ github.ref_name }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and Commit
    runs-on: ubuntu-24.04
    # npm and Composer run code from many packages, so this job can't push.
    # The push job publishes its commit.
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Setup BUILT_BRANCH env
        run: echo "BUILT_BRANCH=${SOURCE_REF}-built" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Checkout the specific branch/ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and checkout built branch
        run: |
          if git ls-remote --exit-code origin "${BUILT_BRANCH}"; then
            git fetch origin "${BUILT_BRANCH}"
            git checkout "${BUILT_BRANCH}"
            git pull origin "${BUILT_BRANCH}"
          else
            git checkout --orphan "${BUILT_BRANCH}" "${SOURCE_REF}"
            git commit --allow-empty -m "Create ${BUILT_BRANCH} branch"
          fi

      - name: Merge current branch into built
        run: |
          git merge "${SOURCE_REF}" --strategy-option theirs --no-edit --squash --allow-unrelated-histories

      - name: Read .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use npm 11.21.3
        run: npm install -g --ignore-scripts npm@11.21.3

      - name: Build
        run: |
          npm ci
          npm run build
          composer install --no-dev --optimize-autoloader --classmap-authoritative

      - name: Remove `/vendor` from .gitignore
        run: |
          sed -i '/vendor/d' .gitignore
          # If the file was modified, add it to the git staging area
          git status -s | grep .gitignore && git add .gitignore

      - name: Get list of changed files
        run: git status -s

      - name: Create Commit Message
        run: |
          # Get the short SHA of the commit
          COMMIT_SHA=${GITHUB_SHA::7}
          # Retrieve the original commit message and replace newlines with spaces
          ORIGINAL_COMMIT_MESSAGE=$(git log -1 --pretty=%B "${GITHUB_SHA}" | tr '\n' ' ' | awk '{$1=$1; sub(/^ +| +$/,"")}1')
          # Construct the commit message safely using printf
          printf "Build \"%s\" (%s)\n" "$ORIGINAL_COMMIT_MESSAGE" "$COMMIT_SHA"  > final_commit_message.txt

      - name: Commit built files
        run: |
          # Add the built files
          git add -A vendor/ build/
          git status -s
          # Commit the changes using the commit message file
          git commit -F final_commit_message.txt --no-verify
          # Bundle the new commits for the push job, leaving out the existing
          # built branch, which the push job fetches.
          mkdir -p "$RUNNER_TEMP/built"
          if git rev-parse --verify --quiet "refs/remotes/origin/${BUILT_BRANCH}" > /dev/null; then
            git bundle create "$RUNNER_TEMP/built/built.bundle" HEAD "^origin/${BUILT_BRANCH}"
          else
            git bundle create "$RUNNER_TEMP/built/built.bundle" HEAD
          fi

      - name: Clean up commit message files
        run: |
          rm final_commit_message.txt

      - name: Save the built commit for the push job
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: built-commit
          path: ${{ runner.temp }}/built/
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  push:
    name: Push built branch
    needs: build
    runs-on: ubuntu-24.04
    # This job holds the write token, so it runs no build or dependency code.
    permissions:
      contents: write
    steps:
      - name: Download the built commit
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/built

      - name: Push the built commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILT_BRANCH="${SOURCE_REF}-built"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init --quiet "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          # The bundle builds on the built branch's current head, if it has one.
          BASE=''
          if git ls-remote --exit-code "$REMOTE" "refs/heads/$BUILT_BRANCH" > /dev/null; then
            git fetch --quiet "$REMOTE" "refs/heads/$BUILT_BRANCH"
            BASE=$(git rev-parse FETCH_HEAD)
          fi
          git fetch --quiet "$RUNNER_TEMP/built/built.bundle" HEAD
          SHA=$(git rev-parse FETCH_HEAD)
          # Only fast-forward the built branch by the one build commit.
          if [ -n "$BASE" ] && [ "$(git rev-parse "$SHA^@")" != "$BASE" ]; then
            echo "The built commit isn't on top of $BUILT_BRANCH, so nothing was pushed." >&2
            exit 1
          fi
          # The lease makes the push fail if the branch changed after BASE was
          # read, including being created or deleted.
          git push --quiet --force-with-lease="refs/heads/$BUILT_BRANCH:$BASE" "$REMOTE" "$SHA:refs/heads/$BUILT_BRANCH"
