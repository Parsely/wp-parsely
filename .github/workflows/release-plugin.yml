name: Release wp-parsely
run-name: Release wp-parsely from ${{ inputs.ref || github.sha }}${{ inputs.dry_run && ' (dry-run)' || '' }}

on:
  push:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      ref:
        description: Source commit or branch (use the original source SHA for retries)
        required: true
        default: trunk
        type: string
      dry_run:
        description: Validate and package without tagging or publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Never interrupt an in-flight SVN commit or GitHub publication.
concurrency:
  group: release-wp-parsely
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.metadata.outputs.release }}
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Resolve and validate release
        id: metadata
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          if [ "$DRY_RUN" != true ]; then
            git merge-base --is-ancestor "$SOURCE_SHA" origin/trunk
          fi
          PREVIOUS_VERSION=''
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            PREVIOUS_VERSION=$(git show "$PREVIOUS_SHA:wp-parsely.php" | sed -n 's/^ \* Version: *//p' | xargs)
            test -n "$PREVIOUS_VERSION"
          fi
          node bin/release-version.mjs metadata "$PREVIOUS_VERSION" > "$RUNNER_TEMP/release.json"
          if [ "$DRY_RUN" != true ]; then
            TRUNK_VERSION=$(git show origin/trunk:wp-parsely.php | sed -n 's/^ \* Version: *//p' | xargs)
            RELEASE_VERSION=$(node -p "require(process.env.RUNNER_TEMP + '/release.json').version")
            test "$RELEASE_VERSION" = "$TRUNK_VERSION"
          fi
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release.json`));
          console.log(`release=${release.release}\nversion=${release.version}`);
          JS
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  lint:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/cs-lint.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  unit:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/unit-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  javascript:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/node.js.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  integration:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/integration-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  e2e:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/e2e-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, lint, unit, javascript, integration, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Build or reuse the exact release snapshot
        id: snapshot
        run: |
          node bin/release-version.mjs metadata > "$RUNNER_TEMP/release.json"
          node --input-type=module <<'JS' > "$RUNNER_TEMP/release-notes.md"
          import { readFileSync } from 'node:fs';
          console.log(JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release.json`)).notes);
          JS
          if [ "$DRY_RUN" != true ] && git show-ref --verify --quiet "refs/tags/$VERSION"; then
            # Only resume our own snapshot of this exact source commit.
            git log -1 --format=%B "$VERSION" | grep -Fxq "Release-Source: $SOURCE_SHA"
            test "$(git rev-parse "$VERSION^1")" = "$SOURCE_SHA"
            git checkout --detach "$VERSION"
            echo 'existing=true' >> "$GITHUB_OUTPUT"
          else
            npm ci
            npm run build
            composer install --no-dev --prefer-dist --optimize-autoloader --classmap-authoritative --no-interaction
            # Preserve built release tags for existing consumers without using
            # a moving *-built branch as the release input.
            git add -f vendor/ build/
            git commit --allow-empty -m "Build wp-parsely $VERSION" -m "Release-Source: $SOURCE_SHA"
            echo 'existing=false' >> "$GITHUB_OUTPUT"
          fi
          test -f vendor/autoload.php
          git archive --format=zip --prefix=wp-parsely/ HEAD -o "$RUNNER_TEMP/wp-parsely.zip"
          unzip -l "$RUNNER_TEMP/wp-parsely.zip" > "$RUNNER_TEMP/zip-files.txt"
          grep -q 'wp-parsely/vendor/autoload.php' "$RUNNER_TEMP/zip-files.txt"
          grep -q 'wp-parsely/build/' "$RUNNER_TEMP/zip-files.txt"
          if grep -Eq 'wp-parsely/(tests|node_modules|\.github)/' "$RUNNER_TEMP/zip-files.txt"; then
            echo 'Development files found in release ZIP' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/package"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/package"

      - name: Save release package for inspection
        uses: actions/upload-artifact@v7
        with:
          name: wp-parsely-${{ env.VERSION }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wp-parsely.zip
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - name: Tag and stage GitHub release
        if: env.DRY_RUN != 'true'
        env:
          EXISTING_TAG: ${{ steps.snapshot.outputs.existing }}
        run: |
          if [ "$EXISTING_TAG" != true ]; then
            git tag -a "$VERSION" -m "wp-parsely $VERSION"
            git push origin "refs/tags/$VERSION"
          fi
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --draft \
              --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Check for an already-published WordPress.org tag
        if: env.DRY_RUN != 'true'
        id: svn
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
          svn ls https://plugins.svn.wordpress.org/wp-parsely/tags/ > "$RUNNER_TEMP/svn-tags.txt"
          if grep -Fxq "$VERSION/" "$RUNNER_TEMP/svn-tags.txt"; then
            svn export "https://plugins.svn.wordpress.org/wp-parsely/tags/$VERSION" "$RUNNER_TEMP/published"
            diff -qr "$RUNNER_TEMP/package" "$RUNNER_TEMP/published"
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the built snapshot to WordPress.org
        if: env.DRY_RUN != 'true' && steps.svn.outputs.published != 'true'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          VERSION: ${{ env.VERSION }}

      - name: Publish GitHub release with the same package
        if: env.DRY_RUN != 'true'
        run: |
          gh release upload "$VERSION" "$RUNNER_TEMP/wp-parsely.zip" --clobber
          gh release edit "$VERSION" --draft=false
