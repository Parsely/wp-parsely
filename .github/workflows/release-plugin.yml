name: Release wp-parsely
run-name: Release wp-parsely from ${{ inputs.ref || github.sha }}${{ inputs.dry_run && ' (dry-run)' || '' }}

on:
  push:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      ref:
        description: Source commit or branch (use the original source SHA for retries)
        required: true
        default: trunk
        type: string
      dry_run:
        description: Validate and package without tagging or publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.metadata.outputs.release }}
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Resolve and validate release
        id: metadata
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          if [ "$DRY_RUN" != true ]; then
            git merge-base --is-ancestor "$SOURCE_SHA" origin/trunk
          fi
          PREVIOUS_VERSION=''
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            PREVIOUS_VERSION=$(git show "$PREVIOUS_SHA:wp-parsely.php" | sed -n 's/^ \* Version: *//p' | xargs)
            test -n "$PREVIOUS_VERSION"
          fi
          node bin/release-version.mjs metadata "$PREVIOUS_VERSION" > "$RUNNER_TEMP/release.json"
          IS_RELEASE=$(node -p "require(process.env.RUNNER_TEMP + '/release.json').release")
          if [ "$DRY_RUN" != true ] && [ "$IS_RELEASE" = true ]; then
            TRUNK_VERSION=$(git show origin/trunk:wp-parsely.php | sed -n 's/^ \* Version: *//p' | xargs)
            RELEASE_VERSION=$(node -p "require(process.env.RUNNER_TEMP + '/release.json').version")
            test "$RELEASE_VERSION" = "$TRUNK_VERSION"
            # Releases must also be newer than all other version tags. The
            # version's own tag is left out, so retries still pass.
            LATEST_TAG=$(git tag --list |
              awk -v current="$RELEASE_VERSION" \
                '/^[0-9]+\.[0-9]+\.[0-9]+$/ && $0 != current' |
              sort -V | tail -n 1)
            node bin/release-version.mjs metadata "$LATEST_TAG" > /dev/null
          fi
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release.json`));
          console.log(`release=${release.release}\nversion=${release.version}`);
          JS
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  lint:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/cs-lint.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  unit:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/unit-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  javascript:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/node.js.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  integration:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/integration-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  e2e:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: ./.github/workflows/e2e-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  package:
    needs: [resolve, lint, unit, javascript, integration, e2e]
    runs-on: ubuntu-24.04
    outputs:
      snapshot: ${{ steps.snapshot.outputs.sha }}
      zip: ${{ steps.snapshot.outputs.zip }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '7.4'
      # The release build doesn't restore caches, which other runs can write.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Use npm 11.21.3
        run: npm install -g --ignore-scripts npm@11.21.3
      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Build or reuse the exact release snapshot
        id: snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          node bin/release-version.mjs metadata > "$RUNNER_TEMP/release.json"
          node --input-type=module <<'JS' > "$RUNNER_TEMP/release/release-notes.md"
          import { readFileSync } from 'node:fs';
          console.log(JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release.json`)).notes);
          JS
          # setup-php stores the job token in ~/.composer. Composer runs without
          # plugins and the token is removed before other build code runs.
          if [ "$DRY_RUN" != true ] && git show-ref --verify --quiet "refs/tags/$VERSION"; then
            COMPOSER_HOME="$HOME/.composer" composer config --global --no-plugins --unset github-oauth.github.com
            # Only resume our own snapshot of this exact source commit.
            git log -1 --format=%B "$VERSION" | grep -Fxq "Release-Source: $SOURCE_SHA"
            test "$(git rev-parse "$VERSION^1")" = "$SOURCE_SHA"
            git checkout --detach "$VERSION"
          else
            composer install --no-dev --no-plugins --prefer-dist --optimize-autoloader --classmap-authoritative --no-interaction
            COMPOSER_HOME="$HOME/.composer" composer config --global --no-plugins --unset github-oauth.github.com
            npm ci --ignore-scripts
            npm run build
            # Preserve built release tags for existing consumers without using
            # a moving *-built branch as the release input.
            git add -f vendor/ build/
            git commit --allow-empty -m "Build wp-parsely $VERSION" -m "Release-Source: $SOURCE_SHA"
          fi
          test -f vendor/autoload.php
          git archive --format=zip --prefix=wp-parsely/ HEAD -o "$RUNNER_TEMP/release/wp-parsely.zip"
          unzip -l "$RUNNER_TEMP/release/wp-parsely.zip" > "$RUNNER_TEMP/zip-files.txt"
          grep -q 'wp-parsely/vendor/autoload.php' "$RUNNER_TEMP/zip-files.txt"
          grep -q 'wp-parsely/build/' "$RUNNER_TEMP/zip-files.txt"
          if grep -Eq 'wp-parsely/(tests|node_modules|\.github)/' "$RUNNER_TEMP/zip-files.txt"; then
            echo 'Development files found in release ZIP' >&2
            exit 1
          fi
          # The publish job takes the snapshot from this bundle instead of building.
          git bundle create "$RUNNER_TEMP/release/snapshot.bundle" HEAD "^$SOURCE_SHA"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "zip=$(sha256sum "$RUNNER_TEMP/release/wp-parsely.zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Save release package for inspection
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: wp-parsely-${{ env.VERSION }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    needs: [resolve, package]
    # Dry runs end with the package job, so they never start the job that
    # holds the release credentials.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-24.04
    environment: wordpress-org
    # Only real publications run this job, so they share one queue and are
    # never cancelled in progress.
    concurrency:
      group: release-wp-parsely-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      SNAPSHOT: ${{ needs.package.outputs.snapshot }}
      ZIP_SHA256: ${{ needs.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Outside the workspace: the deploy action publishes untracked files.
      - name: Download the release package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/release
      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Check out the release snapshot
        run: |
          # No build or dependency code runs here: the snapshot comes from the
          # package job, identified by its commit SHA.
          [[ "$SNAPSHOT" =~ ^[0-9a-f]{40}$ && "$ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git fetch --quiet "$RUNNER_TEMP/release/snapshot.bundle" HEAD
          git log -1 --format=%B "$SNAPSHOT" | grep -Fxq "Release-Source: $SOURCE_SHA"
          test "$(git rev-parse "$SNAPSHOT^1")" = "$SOURCE_SHA"
          git checkout --quiet --detach "$SNAPSHOT"
          echo "$ZIP_SHA256  $RUNNER_TEMP/release/wp-parsely.zip" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/package"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/package"

      - name: Confirm this is still the current release
        run: |
          # Re-running failed jobs keeps the resolve job's earlier outputs, so
          # check trunk and the version tags again before publishing anything.
          git fetch --quiet origin +refs/heads/trunk:refs/remotes/origin/trunk '+refs/tags/*:refs/tags/*'
          git merge-base --is-ancestor "$SOURCE_SHA" origin/trunk
          TRUNK_VERSION=$(git show origin/trunk:wp-parsely.php | sed -n 's/^ \* Version: *//p' | xargs)
          if [ "$VERSION" != "$TRUNK_VERSION" ]; then
            echo "Trunk is at $TRUNK_VERSION, so $VERSION can no longer be published." >&2
            exit 1
          fi
          # Same version tag rule as in resolve.
          LATEST_TAG=$(git tag --list |
            awk -v current="$VERSION" \
              '/^[0-9]+\.[0-9]+\.[0-9]+$/ && $0 != current' |
            sort -V | tail -n 1)
          NEWEST=$(printf '%s\n' "$LATEST_TAG" "$VERSION" | sort -V | tail -n 1)
          if [ -n "$LATEST_TAG" ] && [ "$NEWEST" != "$VERSION" ]; then
            echo "$LATEST_TAG is newer than $VERSION, so $VERSION can no longer be published." >&2
            exit 1
          fi

      - name: Tag and stage GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            if [ "$(git rev-parse "$VERSION^{commit}")" != "$SNAPSHOT" ]; then
              echo "The $VERSION tag points to a different snapshot. Dispatch a new run" \
                "with ref set to $SOURCE_SHA, which reuses the tag if it was built" \
                "from that commit." >&2
              exit 1
            fi
          else
            git tag -a "$VERSION" -m "wp-parsely $VERSION"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$VERSION"
          fi
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --draft \
              --title "$VERSION" --notes-file "$RUNNER_TEMP/release/release-notes.md"
          fi

      - name: Check for an already-published WordPress.org tag
        id: svn
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
          svn ls https://plugins.svn.wordpress.org/wp-parsely/tags/ > "$RUNNER_TEMP/svn-tags.txt"
          if grep -Fxq "$VERSION/" "$RUNNER_TEMP/svn-tags.txt"; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the built snapshot to WordPress.org
        if: steps.svn.outputs.published != 'true'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          VERSION: ${{ env.VERSION }}

      # The deploy action skips versions that already have a tag, so compare
      # the tag with the package whether or not this run deployed it.
      - name: Confirm WordPress.org has the same package
        run: |
          svn export "https://plugins.svn.wordpress.org/wp-parsely/tags/$VERSION" "$RUNNER_TEMP/published"
          diff -qr "$RUNNER_TEMP/package" "$RUNNER_TEMP/published"

      - name: Publish GitHub release with the same package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A published release keeps its ZIP, as --clobber deletes the old one
          # before uploading.
          IS_DRAFT=$(gh release view "$VERSION" --json isDraft --jq .isDraft)
          if [ "$IS_DRAFT" != true ]; then
            echo "$VERSION is already published."
            exit 0
          fi
          gh release upload "$VERSION" "$RUNNER_TEMP/release/wp-parsely.zip" --clobber
          gh release edit "$VERSION" --draft=false
